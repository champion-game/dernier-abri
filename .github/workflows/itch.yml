# Envoie automatiquement le jeu sur itch.io à chaque mise en ligne sur main (outil officiel butler).
# Réglages à faire une fois dans GitHub (Settings du dépôt) :
#  - Secrets and variables → Actions → Secrets : BUTLER_API_KEY = clé API itch.io (itch.io → Settings → API keys)
#  - Secrets and variables → Actions → Variables : ITCH_GAME = utilisateur/projet (ex. amine/barricard)
# Tant que ces deux réglages manquent, l'envoi est simplement sauté (pas d'erreur).
name: Envoi itch.io
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: itch
  cancel-in-progress: true
jobs:
  itch:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_GAME: ${{ vars.ITCH_GAME }}
    steps:
      - name: Réglages présents ?
        id: ok
        run: |
          if [ -n "$BUTLER_API_KEY" ] && [ -n "$ITCH_GAME" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "Réglages itch.io absents : envoi sauté."; fi
      - uses: actions/checkout@v4
        if: steps.ok.outputs.go == '1'
      - name: Préparer le jeu (seulement les fichiers utiles, code sans commentaires)
        if: steps.ok.outputs.go == '1'
        run: |
          mkdir -p build
          cp -r index.html sw.js version.txt manifest.webmanifest src assets build/
          rm -rf build/assets/extras
          find build -name '*.md' -delete
          npm i -s --no-save terser@5 csso-cli@4
          for f in build/src/*.js build/sw.js; do npx terser "$f" -c -m --comments false -o "$f"; done
          npx csso build/src/style.css -o build/src/style.css
      - name: Envoyer sur itch.io
        if: steps.ok.outputs.go == '1'
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push build "$ITCH_GAME:html" --userversion "$(cat version.txt)"

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Barricard – maquette de l’accueil</title>
    <!-- Maquette autonome de l’écran d’accueil : rien ici n’est branché au jeu. Images dans assets/maquette-accueil/.
     Fond : l’image d’Amine, telle quelle. Toutes les fonctions de l’accueil actuel y sont (Jouer / Continuer + Nouvelle
     partie, Collection et decks, Défi du jour, Mutation vaincue, record, prochain déblocage, Règles, Bestiaire, Stats,
     Succès, Crédits, Options, version). Le sélecteur en haut montre les trois états : nouveau joueur, partie en cours, vétéran. -->
    <style>
      @font-face {
        font-family: Oswald;
        src: url(assets/fonts/oswald-600.woff2) format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: Atkinson;
        src: url(assets/fonts/atkinson-400.woff2) format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: Atkinson;
        src: url(assets/fonts/atkinson-700.woff2) format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Special Elite';
        src: url(assets/fonts/special-elite.woff2) format('woff2');
        font-display: swap;
      }
      :root {
        --creme: #f1e4c8;
        --or: #d9a85f;
        --or2: #c9a46a;
        --sous: #d6bf8e;
        --rouge: #e0302a;
        --nuit: #0c0a0b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--nuit);
        color: var(--creme);
        font-family: Atkinson, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      #flou {
        position: fixed;
        inset: -40px;
        background: url(assets/maquette-accueil/fond.webp) center/cover;
        filter: blur(18px) brightness(0.45);
      }
      #scene {
        position: absolute;
        left: 0;
        top: 0;
        width: 1672px;
        height: 941px;
        transform-origin: 0 0;
        opacity: 0;
        animation: entree 1.6s 0.1s ease-out forwards;
      }
      @keyframes entree {
        from {
          opacity: 0;
          filter: brightness(0);
        }
        to {
          opacity: 1;
          filter: none;
        }
      }
      .calque {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #fond {
        background: url(assets/maquette-accueil/fond.webp) 0 0/100% 100%;
      }
      /* voile sombre à gauche, derrière le menu, pour qu'il se détache du décor (PC) */
      #voileG {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #000b 0, #0007 24%, #0000 40%);
        opacity: 0;
        transition: opacity 1s;
      }
      body:not(.portrait) #voileG {
        opacity: 1;
      }

      /* ciel */
      .etoile {
        position: absolute;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 6px 1px #fff8;
        animation: scint var(--d) var(--r) ease-in-out infinite;
      }
      @keyframes scint {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.6);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }
      .filante {
        position: absolute;
        width: 140px;
        height: 2px;
        background: linear-gradient(90deg, #fff0, #fff);
        border-radius: 2px;
        opacity: 0;
        transform: rotate(-18deg);
      }
      .filante.go {
        animation: filante 1.1s ease-out;
      }
      @keyframes filante {
        0% {
          opacity: 0;
          translate: 0 0;
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          translate: -420px 140px;
        }
      }
      #eclair {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 420px;
        background: linear-gradient(#b8c6ff33, #0000);
        opacity: 0;
      }
      #eclair.go {
        animation: eclair 0.9s ease-out;
      }
      @keyframes eclair {
        0% {
          opacity: 0;
        }
        8% {
          opacity: 1;
        }
        16% {
          opacity: 0.2;
        }
        24% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
        }
      }
      #lune {
        position: absolute;
        left: 330px;
        top: 46px;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(#ff2a1a00 45%, #ff2a1a33 52%, #0000 70%);
        mix-blend-mode: screen;
        animation: lune 5s ease-in-out infinite;
      }
      @keyframes lune {
        50% {
          transform: scale(1.08);
          opacity: 0.6;
        }
      }

      /* lumières */
      .lueur {
        position: absolute;
        border-radius: 50%;
        mix-blend-mode: screen;
      }
      #mirador {
        left: 975px;
        top: 120px;
        width: 62px;
        height: 50px;
        background: radial-gradient(#ffd25a 0, #ffb03055 40%, #0000 70%);
        animation: clign 3.4s steps(1) infinite;
      }
      @keyframes clign {
        0%,
        62%,
        70%,
        100% {
          opacity: 1;
        }
        64%,
        68% {
          opacity: 0.25;
        }
      }
      #maison {
        left: 1095px;
        top: 440px;
        width: 90px;
        height: 90px;
        background: radial-gradient(#ffcf55 0, #ffa02866 35%, #0000 70%);
        animation: feu 2.2s ease-in-out infinite;
      }
      #lanterne {
        left: 1435px;
        top: 200px;
        width: 280px;
        height: 300px;
        background: radial-gradient(#ffd27a88 0, #ff9a2a33 30%, #0000 68%);
        animation: feu 1.3s ease-in-out infinite;
      }
      #lanterne2 {
        left: 1350px;
        top: 300px;
        width: 460px;
        height: 420px;
        background: radial-gradient(#ff9a2a22 0, #0000 65%);
        animation: feu 1.9s ease-in-out infinite reverse;
      }
      @keyframes feu {
        0%,
        100% {
          opacity: 0.85;
          transform: scale(1);
        }
        20% {
          opacity: 1;
          transform: scale(1.04);
        }
        45% {
          opacity: 0.7;
          transform: scale(0.97);
        }
        70% {
          opacity: 0.95;
          transform: scale(1.02);
        }
      }
      .fumee {
        position: absolute;
        left: 1104px;
        top: 392px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: radial-gradient(#cfc6bb 0, #cfc6bb88 45%, #0000 70%);
        opacity: 0;
        animation: fumee 5.5s linear infinite;
        animation-delay: var(--d);
      }
      @keyframes fumee {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.5);
        }
        12% {
          opacity: 0.75;
        }
        100% {
          opacity: 0;
          transform: translate(46px, -150px) scale(3.2);
        }
      }
      .braise {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #ffb347;
        box-shadow: 0 0 8px 2px #ff8a1e;
        opacity: 0;
        animation: braise var(--d) var(--r) linear infinite;
      }
      @keyframes braise {
        0% {
          opacity: 0;
          transform: translate(0, 0);
        }
        15% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: translate(var(--x), -260px);
        }
      }
      .brume {
        position: absolute;
        left: -400px;
        width: 2400px;
        height: 300px;
        background: radial-gradient(50% 50% at 50% 50%, #9aa3b11a, #0000 70%);
        animation: brume 38s linear infinite;
      }
      @keyframes brume {
        from {
          transform: translateX(-300px);
        }
        to {
          transform: translateX(300px);
        }
      }
      .jeton {
        position: absolute;
        width: 118px;
        height: 118px;
        border-radius: 50%;
        overflow: hidden;
      }
      .jeton::after,
      .reflet::after {
        content: '';
        position: absolute;
        inset: -40%;
        background: linear-gradient(110deg, #0000 42%, #fff4 50%, #0000 58%);
        transform: translateX(-130%);
      }
      .jeton::after {
        animation: refletJ 6s ease-in-out infinite;
        animation-delay: var(--d);
      }
      @keyframes refletJ {
        0%,
        70% {
          transform: translateX(-130%);
        }
        90%,
        100% {
          transform: translateX(130%);
        }
      }
      .reflet {
        position: absolute;
        left: 0;
        top: 0;
        width: 158px;
        height: 231px;
        transform-origin: 0 0;
        border-radius: 10px;
        overflow: hidden;
      }
      .reflet.go::after {
        animation: eclat 1.2s ease-out;
      }
      @keyframes eclat {
        to {
          transform: translateX(130%);
        }
      }

      /* radio « Dernier Abri » qui défile */
      #radio {
        position: fixed;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 30px;
        padding: 0 14px;
        overflow: hidden;
        font:
          15px 'Special Elite',
          monospace;
        color: #e9dcbf;
        background: linear-gradient(90deg, #0000, #000a 10%, #000a 90%, #0000);
        z-index: 25;
        opacity: 0;
        transition: opacity 1s;
      }
      #radio.go {
        opacity: 1;
      }
      #radio b {
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        font: 600 12px Oswald;
        letter-spacing: 0.12em;
        color: #ff6a55;
      }
      #radio b::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--rouge);
        box-shadow: 0 0 8px var(--rouge);
        animation: clignR 1.2s steps(1) infinite;
      }
      @keyframes clignR {
        50% {
          opacity: 0.2;
        }
      }
      #radio .defile {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        -webkit-mask-image: linear-gradient(90deg, #0000, #000 6%, #000 94%, #0000);
        mask-image: linear-gradient(90deg, #0000, #000 6%, #000 94%, #0000);
      }
      #radio .defile span {
        display: inline-block;
        padding-left: 100%;
        animation: defile 34s linear infinite;
      }
      @keyframes defile {
        to {
          transform: translateX(-100%);
        }
      }

      /* logo */
      #logo {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      #logo img {
        width: 100%;
        display: block;
        filter: drop-shadow(0 8px 14px #000c);
      }
      #logo.go {
        animation: logo 1.1s cubic-bezier(0.2, 1.6, 0.4, 1) forwards;
      }
      @keyframes logo {
        0% {
          opacity: 0;
          transform: scale(2.2) rotate(-6deg);
        }
        55% {
          opacity: 1;
          transform: scale(0.94) rotate(1deg);
        }
        75% {
          transform: scale(1.03);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }
      #logo.vit img {
        animation: respire 4s ease-in-out infinite;
      }
      @keyframes respire {
        50% {
          transform: scale(1.015);
          filter: drop-shadow(0 8px 18px #000c) drop-shadow(0 0 22px #e0201866);
        }
      }
      #logo.tremble {
        animation: tremble 0.4s;
      }
      @keyframes tremble {
        20% {
          transform: translate(-4px, 2px) rotate(-0.6deg);
        }
        40% {
          transform: translate(4px, -2px);
        }
        60% {
          transform: translate(-3px, 1px) rotate(0.4deg);
        }
        80% {
          transform: translate(2px, 0);
        }
      }

      /* menu */
      #menu {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.36em;
      }
      .apparait {
        opacity: 0;
        transform: translateX(-50px);
      }
      .apparait.go {
        animation: glisse 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
      }
      @keyframes glisse {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .tag {
        display: flex;
        align-items: center;
        gap: 0.6em;
        width: 100%;
        margin: 0;
        font:
          0.46em 'Special Elite',
          monospace;
        white-space: nowrap;
        color: #eadbb8;
        text-shadow: 0 2px 4px #000;
      }
      .tag i {
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, #0000, var(--or2), #0000);
      }
      .mwon {
        display: flex;
        align-items: center;
        gap: 0.4em;
        margin: 0;
        padding: 0.18em 0.7em;
        font: 600 0.42em Oswald;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffd27a;
        border: 1px solid #d9a85f88;
        border-radius: 3px;
        background: #1a0f08cc;
        box-shadow: 0 0 14px #ffb34733;
      }
      .mwon svg {
        width: 1.2em;
        height: 1.2em;
        fill: #ffd27a;
      }

      .btn {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.6em;
        width: 100%;
        aspect-ratio: 803/192;
        padding: 0 9% 0 10%;
        background: url(assets/maquette-accueil/plaque.webp) center/100% 100% no-repeat;
        color: var(--creme);
        text-align: left;
        transition:
          transform 0.18s,
          filter 0.18s;
      }
      .btn .ic {
        flex: none;
        display: grid;
        place-items: center;
        width: 1.25em;
        height: 1.25em;
      }
      .btn svg {
        width: 100%;
        height: 100%;
        fill: var(--creme);
        filter: drop-shadow(0 2px 0 #000);
      }
      .btn .tx {
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1.05;
      }
      .btn .tx b {
        font: 600 0.64em Oswald;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-shadow:
          0 2px 0 #000,
          0 0 10px #0008;
        white-space: nowrap;
      }
      .btn .tx small {
        margin-top: 0.25em;
        font: 400 0.36em Atkinson;
        color: var(--sous);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .btn.second {
        width: 90%;
      }
      .btn.jouer {
        justify-content: center;
        text-align: center;
        padding: 0 8%;
        background-image: url(assets/maquette-accueil/plaque-rouge.webp);
      }
      .btn.jouer .tx {
        align-items: center;
      }
      .btn.jouer .tx b {
        font-size: 0.9em;
        letter-spacing: 0.07em;
      }
      .btn.jouer .tx small {
        font-size: 0.44em;
        color: #ffe2c4;
      }
      .btn.jouer::after {
        content: '';
        position: absolute;
        inset: 8% 4%;
        border-radius: 4px;
        box-shadow: 0 0 22px 4px #ff3a2a44;
        animation: pouls 2.2s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes pouls {
        50% {
          box-shadow: 0 0 34px 10px #ff3a2a88;
        }
      }
      .btn:hover {
        transform: scale(1.035);
        filter: brightness(1.18);
      }
      .btn:active {
        transform: scale(0.97);
        filter: brightness(0.9);
      }
      .btn::before {
        content: '';
        position: absolute;
        inset: 10% 3%;
        border-radius: 4px;
        background: linear-gradient(105deg, #0000 40%, #fff3 50%, #0000 60%) -200% 0/200% 100% no-repeat;
        transition: background-position 0.6s;
        pointer-events: none;
      }
      .btn:hover::before {
        background-position: 200% 0;
      }
      .nouveau {
        position: absolute;
        right: 4%;
        top: -14%;
        padding: 0.12em 0.5em;
        font: 600 0.38em Oswald;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff;
        background: #c4161c;
        border: 1.5px solid #ffd27a;
        border-radius: 3px;
        transform: rotate(6deg);
        box-shadow: 0 3px 8px #000a;
        animation: tampon 1.6s ease-in-out infinite;
      }
      @keyframes tampon {
        50% {
          transform: rotate(6deg) scale(1.12);
        }
      }
      .etat {
        position: absolute;
        right: 4%;
        top: -14%;
        transform: rotate(6deg);
        box-shadow: 0 3px 8px #000a;
        padding: 0.12em 0.5em;
        font: 600 0.36em Oswald;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 3px;
      }
      .etat.afaire {
        color: #1a0f08;
        background: #ffd27a;
        animation: tampon2 1.8s ease-in-out infinite;
      }
      @keyframes tampon2 {
        50% {
          box-shadow:
            0 0 14px #ffd27a,
            0 3px 8px #000a;
        }
      }
      .lien {
        margin: -0.1em 0 0.1em;
        font: 600 0.42em Oswald;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #e9d6ae;
        text-shadow: 0 2px 3px #000;
        border-bottom: 1px solid #d9a85f88;
        padding: 0.1em 0.1em;
        transition: color 0.2s;
      }
      .lien:hover {
        color: #ffd27a;
      }

      /* carnet du survivant : record et prochain déblocage */
      .carnet {
        width: 90%;
        margin-top: 0.15em;
        padding: 0.45em 0.7em 0.5em;
        border-radius: 4px;
        background: linear-gradient(#e9d9b4, #d9c393);
        color: #2a1d10;
        box-shadow:
          0 6px 14px #000c,
          inset 0 0 0 1px #8a6a3a66;
        transform: rotate(-1deg);
      }
      .carnet .lg {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5em;
        font:
          0.4em 'Special Elite',
          monospace;
      }
      .carnet .lg b {
        font: 600 1.15em Oswald;
        letter-spacing: 0.03em;
        color: #7a1410;
      }
      .carnet .bar {
        height: 0.32em;
        margin: 0.3em 0 0.2em;
        border-radius: 1em;
        background: #2a1d1033;
        overflow: hidden;
      }
      .carnet .bar i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 1em;
        background: linear-gradient(90deg, #7a1410, #c4161c);
        transition: width 1.4s cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .carnet .pr {
        font: 0.38em Atkinson;
        color: #3a2a18;
      }

      /* barre du bas et roue : plaque dorée, comme les boutons */
      #barre {
        position: fixed;
        left: 50%;
        bottom: max(1.6vh, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        width: min(64vw, 820px);
        padding: 4px 10px;
        border-style: solid;
        border-width: 16px;
        border-image: url(assets/maquette-accueil/plaque.webp) 52 fill / 16px stretch;
        filter: drop-shadow(0 6px 10px #000c);
        z-index: 30;
        opacity: 0;
        transition: opacity 0.6s;
      }
      #barre.go {
        opacity: 1;
      }
      .tab {
        position: relative;
        flex: 1 1 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-width: 0;
        padding: 4px 4px;
        border-left: 1px solid #c9a46a55;
        font: 600 clamp(13px, 1.15vw, 16px) Oswald;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        white-space: nowrap;
        transition:
          color 0.2s,
          transform 0.2s;
      }
      .tab:first-child {
        border-left: 0;
      }
      .tab:hover {
        color: #ffd88a;
        transform: translateY(-2px);
      }
      .tab svg {
        width: 21px;
        height: 21px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tab .mini {
        position: absolute;
        left: 22%;
        right: 22%;
        bottom: -3px;
        height: 3px;
        border-radius: 2px;
        background: #ffffff22;
        overflow: hidden;
      }
      .tab .mini i {
        display: block;
        height: 100%;
        background: var(--or);
      }
      .tab.cr {
        flex: 0.6 1 0;
        font: 400 14px Atkinson;
        text-transform: none;
        letter-spacing: 0;
      }
      #roue {
        position: fixed;
        top: max(1.6vh, env(safe-area-inset-top));
        right: 1.4vw;
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-style: solid;
        border-width: 12px;
        border-image: url(assets/maquette-accueil/plaque.webp) 52 fill / 12px stretch;
        filter: drop-shadow(0 6px 10px #000c);
        z-index: 30;
        transition: transform 0.4s;
      }
      #roue svg {
        width: 28px;
        height: 28px;
        fill: none;
        stroke: var(--creme);
        stroke-width: 2;
      }
      #roue:hover {
        transform: rotate(60deg);
        filter: drop-shadow(0 6px 10px #000c) brightness(1.3);
      }
      #ver {
        position: fixed;
        right: 10px;
        bottom: 6px;
        margin: 0;
        font-size: 11px;
        opacity: 0.6;
        z-index: 30;
      }

      /* sélecteur d'état de la maquette */
      #etats {
        position: fixed;
        left: 10px;
        bottom: 10px;
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 6px;
        background: #000c;
        border: 1px dashed #d9a85f88;
        z-index: 45;
        font: 600 11px Oswald;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #etats button {
        padding: 4px 8px;
        border-radius: 4px;
        color: #bfae8a;
      }
      #etats button.on {
        background: var(--or);
        color: #1a0f08;
      }

      #toast {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -30%);
        opacity: 0;
        background: #120e0ce6;
        border: 1px solid var(--or);
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 15px;
        transition: 0.3s;
        z-index: 40;
        pointer-events: none;
        white-space: nowrap;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, -50%);
      }

      /* téléphone en portrait */
      body.portrait #barre {
        width: calc(100vw - 20px);
        padding: 2px 4px;
      }
      body.portrait .tab {
        flex-direction: column;
        gap: 3px;
        padding: 4px 1px;
        font-size: 11px;
      }
      body.portrait .tab.cr {
        display: none;
      }
      body.portrait #ver {
        display: none;
      }
      body.portrait #etats {
        left: 8px;
        bottom: auto;
        top: max(10px, env(safe-area-inset-top));
        font-size: 10px;
      }
      body.portrait #etats button {
        padding: 4px 6px;
      }
      body.portrait .carnet .pr,
      body.portrait .tag {
        display: none;
      }
      body.portrait .carnet {
        padding: 0.35em 0.7em 0.4em;
      }
      body.portrait #scene {
        -webkit-mask-image: linear-gradient(#0000 0, #000 22%);
        mask-image: linear-gradient(#0000 0, #000 22%);
      }
      body.portrait #roue {
        width: 48px;
        height: 48px;
        border-width: 10px;
        border-image-width: 10px;
      }
      body.portrait #roue svg {
        width: 22px;
        height: 22px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="flou"></div>
    <div id="scene">
      <div class="calque" id="fond"></div>
      <div class="calque" id="voileG"></div>
      <div class="calque" id="ciel">
        <div id="lune"></div>
        <div id="eclair"></div>
      </div>
      <div class="calque" id="lumieres">
        <div class="lueur" id="mirador"></div>
        <div class="lueur" id="maison"></div>
        <div class="lueur" id="lanterne2"></div>
        <div class="lueur" id="lanterne"></div>
        <div class="jeton" style="left: 1272px; top: 778px; --d: 1s"></div>
        <div class="jeton" style="left: 1383px; top: 808px; --d: 1.6s"></div>
      </div>
      <div class="calque" id="table"></div>
      <div class="calque">
        <div class="brume" style="top: 600px"></div>
        <div
          class="brume"
          style="top: 700px; animation-duration: 55s; animation-direction: reverse; opacity: 0.7"
        ></div>
      </div>
    </div>

    <div id="radio">
      <b>Radio</b>
      <div class="defile">
        <span
          >Ici Dernier Abri, Ici Dernier Abri… Si vous entendez ce message, tenez bon : les secours arrivent dans 30
          nuits. Barricadez portes et fenêtres. Ne sortez jamais la nuit. Et surtout, ne vous laissez pas mordre. Ici
          Dernier Abri, terminé.</span
        >
      </div>
    </div>
    <div id="logo"><img src="assets/maquette-accueil/logo.webp" alt="Barricard" /></div>
    <nav id="menu"></nav>
    <nav id="barre">
      <button class="tab" data-msg="Règles">
        <svg viewBox="0 0 24 24">
          <path d="M3 5c3-1.5 6-1.5 9 0v15c-3-1.5-6-1.5-9 0zM21 5c-3-1.5-6-1.5-9 0v15c3-1.5 6-1.5 9 0z" /></svg
        ><span>Règles</span>
      </button>
      <button class="tab" data-msg="Bestiaire">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 3c-4.4 0-7.5 3-7.5 7 0 2.4 1.1 4 2.5 5v3h10v-3c1.4-1 2.5-2.6 2.5-5 0-4-3.1-7-7.5-7zM9 18v3M12 18v3M15 18v3"
          />
          <circle cx="9" cy="11" r="1.6" />
          <circle cx="15" cy="11" r="1.6" /></svg
        ><span>Bestiaire</span>
      </button>
      <button class="tab" data-msg="Stats">
        <svg viewBox="0 0 24 24"><path d="M5 20v-6M10 20V9M15 20v-8M20 20V5M3 20h19" /></svg><span>Stats</span>
      </button>
      <button class="tab" data-msg="Succès">
        <svg viewBox="0 0 24 24">
          <path d="M7 4h10v5a5 5 0 01-10 0zM7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3M12 14v4M8 21h8M9 18h6" /></svg
        ><span id="succes">Succès 0/28</span><span class="mini"><i id="succesBar"></i></span>
      </button>
      <button class="tab cr" data-msg="Crédits">Crédits</button>
    </nav>
    <button id="roue" data-msg="Options" aria-label="Options">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.2" />
        <path
          d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3"
        />
        <circle cx="12" cy="12" r="6.6" />
      </svg>
    </button>
    <p id="ver">v300 · 23 nov.</p>
    <div id="etats">
      <button data-e="nouveau">Nouveau joueur</button><button data-e="encours" class="on">Partie en cours</button
      ><button data-e="veteran">Vétéran</button>
    </div>
    <div id="toast"></div>

    <script>
      'use strict';
      const W = 1672,
        H = 941,
        CW = 158,
        CH = 231;
      const $ = s => document.querySelector(s);
      const scene = $('#scene'),
        logo = $('#logo'),
        menu = $('#menu'),
        table = $('#table');

      // --- Icônes dessinées (jamais d'emoji) ---
      const ICO = {
        coll: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="10" height="15" rx="1.6" transform="rotate(-14 8 12.5)"/><rect x="10.5" y="4" width="10" height="15" rx="1.6" transform="rotate(10 15.5 11.5)" stroke="#1a0f0c" stroke-width="1.8"/></svg>',
        defi: '<svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h2.5A1.5 1.5 0 0121 5.5v14a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 19.5v-14A1.5 1.5 0 014.5 4H7zM5 9v10h14V9zm2 2h3v3H7zm4.5 0h3v3h-3zm4.5 0h3v3h-3zm-9 4.5h3V18H7zm4.5 0h3V18h-3z" fill-rule="evenodd"/></svg>',
        trophee:
          '<svg viewBox="0 0 24 24"><path d="M7 3h10v2h4v3a5 5 0 01-4.6 5A5 5 0 0113 15.9V18h3v3H8v-3h3v-2.1A5 5 0 017.6 13 5 5 0 013 8V5h4zm10 4v4a3 3 0 002-3V7zM5 7v1a3 3 0 002 3V7z"/></svg>',
      };

      /* --- Les trois états de l'accueil (données d'exemple) ---
   nouveau : première partie (pas de Collection, comme dans le jeu pour un novice) ;
   encours : une partie sauvegardée (Continuer + Nouvelle partie) ;
   veteran : Mutation vaincue, record, nouvelles cartes à voir. */
      const ETATS = {
        nouveau: {
          save: null,
          coll: false,
          won: null,
          best: 0,
          unlock: ['La policière', 0, 8],
          ach: 0,
          defiFait: false,
        },
        encours: {
          save: { phase: 'Jour', nuit: 7, deck: 'Fusillade', mut: 1 },
          coll: true,
          nouveau: true,
          won: null,
          best: 12,
          unlock: ['La policière', 22, 30],
          ach: 6,
          defiFait: false,
        },
        veteran: {
          save: null,
          coll: true,
          won: { mut: 3, wins: 5 },
          best: 38,
          unlock: ['Le moine', 141, 150],
          ach: 19,
          defiFait: true,
        },
      };
      let etat = 'encours';

      function plaque(cls, act, icone, titre, sous, extra = '') {
        return `<button class="btn ${cls} apparait" data-msg="${act}">${icone ? `<span class="ic">${icone}</span>` : ''}<span class="tx"><b>${titre}</b>${sous ? `<small>${sous}</small>` : ''}</span>${extra}</button>`;
      }
      function construireMenu() {
        const e = ETATS[etat];
        let h = '<p class="tag apparait"><i></i>Tiens 30 nuits jusqu’à l’arrivée des secours.<i></i></p>';
        if (e.won)
          h += `<p class="mwon apparait">${ICO.trophee} Mutation ${e.won.mut} vaincue · ${e.won.wins} victoires</p>`;
        if (e.save) {
          const s = e.save;
          h += plaque(
            'jouer',
            'Continuer',
            '',
            `Continuer · ${s.phase} ${s.nuit}`,
            `Deck ${s.deck} · Mutation ${s.mut}`,
          );
          h += '<button class="lien apparait" data-msg="Nouvelle partie">Nouvelle partie</button>';
        } else {
          h += plaque(
            'jouer',
            'Jouer',
            '',
            'Jouer',
            e.best ? 'Choisis ton deck et ta Mutation' : 'Première nuit : le tutoriel te guide',
          );
        }
        if (e.coll)
          h += plaque(
            'second',
            'Collection et decks',
            ICO.coll,
            'Collection et decks',
            '96 / 180 cartes · 3 decks',
            e.nouveau ? '<span class="nouveau">Nouveau !</span>' : '',
          );
        h += plaque(
          'second',
          'Défi du jour',
          ICO.defi,
          'Défi du jour',
          '<span id="compte">Nouveau défi dans --:--:--</span>',
          e.defiFait ? '' : '<span class="etat afaire">À faire</span>',
        );
        const [nom, fait, total] = e.unlock;
        h += `<div class="carnet apparait">
    ${e.best ? `<div class="lg"><span>Record</span><b>${e.best} nuits</b></div>` : ''}
    <div class="lg"><span>Prochain déblocage</span><b>${nom}</b></div>
    <div class="bar"><i data-w="${Math.round((fait / total) * 100)}"></i></div>
    <div class="pr">${total - fait} nuits au total avant le déblocage</div></div>`;
        menu.innerHTML = h;
        $('#succes').textContent = `Succès ${e.ach}/28`;
        $('#succesBar').style.width = (e.ach / 28) * 100 + '%';
        brancherBoutons(menu);
        majCompte();
        placer();
      }
      // apparition en cascade du menu, puis la barre de progression se remplit
      function animerMenu(delai = 0) {
        menu.querySelectorAll('.apparait').forEach((b, i) => setTimeout(() => b.classList.add('go'), delai + i * 100));
        setTimeout(
          () => menu.querySelectorAll('.bar i').forEach(i => (i.style.width = i.dataset.w + '%')),
          delai + 700,
        );
      }

      // compte à rebours jusqu'au prochain défi (minuit)
      function majCompte() {
        const c = $('#compte');
        if (!c) return;
        const n = new Date(),
          m = new Date(n);
        m.setHours(24, 0, 0, 0);
        const s = Math.floor((m - n) / 1000);
        const p = v => String(v).padStart(2, '0');
        c.textContent = `Nouveau défi dans ${p(Math.floor(s / 3600))}:${p(Math.floor((s % 3600) / 60))}:${p(s % 60)}`;
      }
      setInterval(majCompte, 1000);

      // --- Cartes du dessin : un reflet passe de temps en temps (coins mesurés sur l'image) ---
      const COINS = [
        [
          [595, 640],
          [750, 660],
          [482, 790],
        ],
        [
          [775, 717],
          [927, 725],
          [705, 887],
        ],
        [
          [920, 732],
          [1062, 737],
          [857, 892],
        ],
        [
          [1057, 737],
          [1222, 755],
          [992, 902],
        ],
      ];
      const reflets = COINS.map(([tl, tr, bl]) => {
        const el = document.createElement('div');
        el.className = 'reflet';
        el.style.transform = `matrix(${(tr[0] - tl[0]) / CW},${(tr[1] - tl[1]) / CW},${(bl[0] - tl[0]) / CH},${(bl[1] - tl[1]) / CH},${tl[0]},${tl[1]})`;
        table.appendChild(el);
        return el;
      });
      setInterval(() => {
        const el = reflets[Math.floor(Math.random() * reflets.length)];
        el.classList.remove('go');
        void el.offsetWidth;
        el.classList.add('go');
      }, 2600);

      // --- Ciel ---
      const ciel = $('#ciel');
      for (let i = 0; i < 46; i++) {
        const x = Math.random() * W,
          y = Math.random() * 230;
        if (x < 640 && y < 320) {
          i--;
          continue;
        }
        const s = document.createElement('div');
        const t = 2 + Math.random() * 2.5;
        s.className = 'etoile';
        s.style.cssText = `left:${x}px;top:${y}px;width:${t}px;height:${t}px;--d:${2 + Math.random() * 4}s;--r:-${Math.random() * 5}s`;
        ciel.appendChild(s);
      }
      const filante = document.createElement('div');
      filante.className = 'filante';
      ciel.appendChild(filante);
      setInterval(() => {
        filante.style.left = 900 + Math.random() * 650 + 'px';
        filante.style.top = 20 + Math.random() * 90 + 'px';
        filante.classList.remove('go');
        void filante.offsetWidth;
        filante.classList.add('go');
      }, 7000);
      const eclair = $('#eclair');
      (function orage() {
        setTimeout(
          () => {
            eclair.classList.remove('go');
            void eclair.offsetWidth;
            eclair.classList.add('go');
            son('tonnerre');
            if (logo.classList.contains('vit')) {
              logo.classList.remove('tremble');
              void logo.offsetWidth;
              logo.classList.add('tremble');
            }
            orage();
          },
          9000 + Math.random() * 9000,
        );
      })();

      // --- Fumée et braises ---
      const lum = $('#lumieres');
      for (let i = 0; i < 7; i++) {
        const f = document.createElement('div');
        f.className = 'fumee';
        f.style.setProperty('--d', -i * 0.8 + 's');
        lum.appendChild(f);
      }
      for (let i = 0; i < 18; i++) {
        const b = document.createElement('div');
        b.className = 'braise';
        b.style.cssText =
          i < 7
            ? `left:${1555 + Math.random() * 40}px;top:${330 + Math.random() * 30}px;--d:${3 + Math.random() * 3}s;--r:-${Math.random() * 6}s;--x:${-30 + Math.random() * 60}px`
            : `left:${560 + Math.random() * 900}px;top:${300 + Math.random() * 300}px;--d:${6 + Math.random() * 6}s;--r:-${Math.random() * 12}s;--x:${-80 + Math.random() * 160}px;background:#e9ff9a;box-shadow:0 0 8px 2px #c8ff5a88;width:3px;height:3px`;
        lum.appendChild(b);
      }

      // --- Petits sons (générés, comme dans le jeu) : survol, clic, tonnerre lointain ---
      let ctx = null;
      function son(type) {
        if (!ctx) return;
        const t = ctx.currentTime;
        if (type === 'tonnerre') {
          const n = ctx.createBufferSource(),
            b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate),
            d = b.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
          n.buffer = b;
          const f = ctx.createBiquadFilter();
          f.type = 'lowpass';
          f.frequency.value = 180;
          const g = ctx.createGain();
          g.gain.value = 0.35;
          n.connect(f).connect(g).connect(ctx.destination);
          n.start(t + 0.3);
          return;
        }
        const o = ctx.createOscillator(),
          g = ctx.createGain();
        o.type = type === 'clic' ? 'triangle' : 'sine';
        o.frequency.setValueAtTime(type === 'clic' ? 180 : 620, t);
        o.frequency.exponentialRampToValueAtTime(type === 'clic' ? 60 : 900, t + 0.08);
        g.gain.setValueAtTime(type === 'clic' ? 0.25 : 0.04, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + (type === 'clic' ? 0.18 : 0.06));
        o.connect(g).connect(ctx.destination);
        o.start(t);
        o.stop(t + 0.2);
      }
      addEventListener(
        'pointerdown',
        () => {
          if (!ctx)
            try {
              ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        },
        { once: true },
      );

      // --- Boutons : message (maquette) ---
      const toast = $('#toast');
      let tt;
      function brancherBoutons(racine) {
        racine.querySelectorAll('[data-msg]').forEach(b => {
          b.addEventListener('mouseenter', () => son('survol'));
          b.addEventListener('click', e => {
            e.stopPropagation();
            son('clic');
            toast.textContent = b.dataset.msg + ' (maquette)';
            toast.classList.add('on');
            clearTimeout(tt);
            tt = setTimeout(() => toast.classList.remove('on'), 1400);
          });
        });
      }
      brancherBoutons($('#barre'));
      brancherBoutons({ querySelectorAll: () => [$('#roue')] });
      document.querySelectorAll('#etats button').forEach(b =>
        b.addEventListener('click', () => {
          document.querySelectorAll('#etats button').forEach(x => x.classList.toggle('on', x === b));
          etat = b.dataset.e;
          construireMenu();
          animerMenu();
        }),
      );

      // --- Mise en page ---
      let echelle = 1,
        ox = 0,
        oy = 0;
      function placer() {
        const vw = innerWidth,
          vh = innerHeight;
        const portrait = vw / vh < 1.05;
        document.body.classList.toggle('portrait', portrait);
        const radio = $('#radio');
        if (!portrait) {
          echelle = Math.min(Math.max(vw / W, vh / H), vw / 1600, vh / 880);
          ox = (vw - W * echelle) / 2;
          oy = (vh - H * echelle) / 2;
          if (ox < 0) ox = Math.max(ox, vw - W * echelle);
          poser(logo, 55, 30, 500);
          poser(menu, 55, 238, 430);
          menu.style.fontSize = 40 * echelle + 'px';
          Object.assign(radio.style, {
            left: ox + 620 * echelle + 'px',
            top: oy + 18 * echelle + 'px',
            width: 760 * echelle + 'px',
          });
        } else {
          echelle = vw / 1100;
          ox = -440 * echelle;
          const mw = Math.min(vw - 60, 310);
          Object.assign(menu.style, {
            left: (vw - mw) / 2 + 'px',
            width: mw + 'px',
            fontSize: Math.min(26, mw / 13) + 'px',
          });
          const topMenu = vh - ($('#barre').offsetHeight + 20) - menu.offsetHeight - 6;
          menu.style.top = topMenu + 'px';
          oy = topMenu - 925 * echelle;
          const lw = Math.min(vw - 110, 300);
          Object.assign(logo.style, {
            left: (vw - lw) / 2 + 'px',
            top: Math.max(90, oy + 255 * echelle - lw * 0.36) + 'px',
            width: lw + 'px',
          });
          Object.assign(radio.style, { left: '0px', top: '58px', width: vw + 'px' });
        }
        scene.style.transform = `translate(${ox}px,${oy}px) scale(${echelle})`;
      }
      function poser(el, x, y, w) {
        el.style.left = ox + x * echelle + 'px';
        el.style.top = oy + y * echelle + 'px';
        el.style.width = w * echelle + 'px';
      }
      addEventListener('resize', placer);
      construireMenu();

      // --- Entrée ---
      setTimeout(() => logo.classList.add('go'), 700);
      setTimeout(() => {
        logo.classList.remove('go');
        logo.style.opacity = 1;
        logo.classList.add('vit');
      }, 1850);
      animerMenu(1250);
      setTimeout(() => $('#barre').classList.add('go'), 1700);
      setTimeout(() => $('#radio').classList.add('go'), 2300);
    </script>
  </body>
</html>

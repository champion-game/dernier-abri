<body>

<div class="app">
 <div class="side">
  <div class="top">
    <div class="brand">Dernier Abri</div>
    <button type="button" class="mute pz" id="pz" aria-label="Pause et menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
    <button type="button" class="mute" id="mute"></button>
    <button type="button" class="mute fs" id="fs" aria-label="Plein écran" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button type="button" class="mute mtb" id="mtb" aria-label="Détails des combats"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 20v-6M12 20V8M17 20v-11"/></svg></button>
    <button type="button" class="round" id="round" aria-label="Ton deck et tes reliques"></button>
    <div class="shel"><div class="shel-t"><span>Abri</span><b id="shelT"></b></div><div class="shel-bar"><i id="shelB"></i></div></div>
  </div>
  <div class="mat">
   <div class="event" id="event"></div>
   <div class="horde" id="horde"></div>
   <div class="fams" id="fams"></div>
  </div>
 </div>
  <canvas class="woods" id="woods" aria-hidden="true"></canvas>
  <canvas class="map" id="map" aria-label="Carte autour de l’abri"></canvas>
 <div class="side side2">
  <div class="tip" id="tip" hidden></div>
  <div class="meter" id="meter" hidden></div>
  <div class="info" id="info"></div>
  <div class="table" id="table">
    <div class="piles"><button type="button" class="pile draw" id="pDraw" aria-label="Pioche"></button><button type="button" class="pile res" id="pRes" aria-label="Réserve" hidden></button></div>
    <div class="hand" id="hand"></div>
    <div class="piles"><button type="button" class="pile disc" id="pDisc" aria-label="Défausse"></button></div>
  </div>
  <button class="go" id="go" type="button">Affronter la nuit</button>
 </div>
</div>
<div class="overlay" id="ov"><div class="panel" id="panel"></div></div>

<script src="src/engine.js?v=138"></script>

<!doctype html>
<html lang="fr" class="artx">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barricard</title>
<meta name="theme-color" content="#0d0f0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barricard">
<link rel="preload" as="image" href="assets/boot/logo.webp">
<link rel="stylesheet" href="src/style.css?v=263">
<style>
/* v254 : écran de chargement (src/game-load.js) : fond et logo de l'accueil (versions allégées, assets/boot/), barre dans le panneau noir, astuces écrites sur le fond. Ici pour être stylé avant style.css ; visible seulement après 0,4 s */
#boot{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:#0b0a09 url(assets/boot/fond-portrait.webp) center/cover;opacity:0;animation:bootIn .3s ease-out .4s forwards;transition:opacity .35s}
#boot:before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(8,9,7,.35),rgba(8,9,7,.15) 40%,rgba(8,9,7,.85) 72%,#0b0a09)}
#boot.out{opacity:0!important;animation:none;pointer-events:none}
@keyframes bootIn{to{opacity:1}}
.boot-top,.boot-bot{position:relative;width:min(320px,82vw);text-align:center}
.boot-top{margin-top:9vh}
.boot-top img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.7))}
.boot-bot{margin-bottom:7vh}
.boot-bar{box-sizing:content-box;height:14px;padding:5px 7px;border-style:solid;border-image:url(assets/art/ui/panneau-noir.webp) 36 fill / 10px stretch;filter:drop-shadow(0 3px 6px rgba(0,0,0,.7))}
.boot-tr{height:100%;border-radius:2px;background:rgba(0,0,0,.55);box-shadow:inset 0 1px 3px #000;overflow:hidden}
.boot-tr i{display:block;width:0;height:100%;border-radius:2px;background:linear-gradient(#e0483a,#c8141a 55%,#8a1912);box-shadow:0 0 10px rgba(200,20,26,.6);transition:width .25s}
.boot-pct{display:flex;justify-content:space-between;min-height:18px;margin-top:8px;font:600 12px var(--ax-head);letter-spacing:.08em;color:#c9bea6;text-transform:uppercase;text-shadow:0 1px 3px #000}
.boot-tip{min-height:84px;margin:30px 0 0;padding:0 6px;font:400 15px/1.45 var(--f-body);color:#f1e7cf;text-shadow:0 1px 4px #000,0 0 12px rgba(0,0,0,.8);transition:opacity .3s}
.boot-tip em{display:block;font:600 12px var(--ax-head);font-style:normal;letter-spacing:.16em;color:#ffd36b;margin-bottom:6px}
.boot-tip.fade{opacity:0}
/* v255 : en largeur (PC, téléphone tourné), tout à gauche comme le menu de l'accueil ; le plateau reste visible à droite */
@media (orientation:landscape){#boot{justify-content:center;align-items:flex-start;padding-left:6vw;background-image:url(assets/boot/fond.webp)}#boot:before{background:linear-gradient(90deg,rgba(8,9,7,.85),rgba(8,9,7,.55) 38%,transparent 60%)}.boot-top,.boot-bot{width:min(400px,40vw,70vh)}.boot-top{margin:0 0 7vh}.boot-bot{margin:0}.boot-tip{text-align:left;margin-top:5vh;padding:0}}
@media (orientation:landscape) and (max-height:500px){.boot-top{margin-bottom:4vh}.boot-tip{margin-top:12px;min-height:0}}
</style>
</head>
<body>
<div id="boot" aria-hidden="true"><div class="boot-top"><img src="assets/boot/logo.webp" alt="" width="640" height="267"></div><div class="boot-bot"><div class="boot-bar"><div class="boot-tr"><i id="bootBar"></i></div></div><div class="boot-pct"><span id="bootStep"></span><span id="bootPct"></span></div><p class="boot-tip" id="bootTip"></p></div></div>

<div class="app">
 <div class="side">
  <div class="top">
    <div class="brand">Barricard</div>
    <button type="button" class="mute pz" id="pz" aria-label="Pause et menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
    <button type="button" class="mute" id="mute"></button>
    <button type="button" class="mute fs" id="fs" aria-label="Plein écran" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button type="button" class="mute mtb" id="mtb" aria-label="Détails des combats"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 20v-6M12 20V8M17 20v-11"/></svg></button>
    <button type="button" class="mute holes" id="holes" aria-label="Zones non couvertes" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button type="button" class="round" id="round" aria-label="Ton deck et tes reliques"></button>
    <div class="shel"><div class="shel-t"><span>Abri</span><b id="shelT"></b></div><div class="shel-bar"><i id="shelB"></i></div></div>
  </div>
  <div class="mat">
   <div class="event" id="event"></div>
   <div class="horde" id="horde"></div>
   <div class="fams" id="fams"></div>
  </div>
 </div>
  <canvas class="woods" id="woods" aria-hidden="true"></canvas>
  <canvas class="map" id="map" aria-label="Carte autour de l’abri"></canvas>
 <div class="side side2">
  <div class="tip" id="tip" hidden></div>
  <div class="meter" id="meter" hidden></div>
  <div class="info" id="info"></div>
  <div class="table" id="table">
    <div class="piles"><button type="button" class="pile draw" id="pDraw" aria-label="Pioche"></button><button type="button" class="pile res" id="pRes" aria-label="Réserve" hidden></button></div>
    <div class="hand" id="hand"></div>
    <div class="piles"><button type="button" class="pile disc" id="pDisc" aria-label="Défausse"></button></div>
  </div>
  <button class="go" id="go" type="button">Affronter la nuit</button>
 </div>
 <div class="felt" id="felt"><div class="fpiles" id="fpiles"></div></div>
</div>
<div class="overlay" id="ov"><div class="panel" id="panel"></div></div>

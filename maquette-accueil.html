<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Barricard – maquette de l’accueil</title>
    <!-- Maquette autonome de l’écran d’accueil : rien ici n’est branché au jeu. Images dans assets/maquette-accueil/. -->
    <style>
      @font-face {
        font-family: Oswald;
        src: url(assets/fonts/oswald-600.woff2) format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: Atkinson;
        src: url(assets/fonts/atkinson-400.woff2) format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      :root {
        --creme: #f1dfb8;
        --or: #d9a85f;
        --rouge: #c4161c;
        --nuit: #0c0a0b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--nuit);
        color: var(--creme);
        font-family: Atkinson, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      /* fond flou qui remplit les bords quand la scène ne couvre pas tout l’écran */
      #flou {
        position: fixed;
        inset: -40px;
        background: url(assets/maquette-accueil/fond.webp) center/cover;
        filter: blur(18px) brightness(0.45);
      }

      /* scène : l’image 1672 × 941 en pixels, mise à l’échelle par le script */
      #scene {
        position: absolute;
        left: 0;
        top: 0;
        width: 1672px;
        height: 941px;
        transform-origin: 0 0;
        opacity: 0;
        animation: entree 1.6s 0.1s ease-out forwards;
      }
      @keyframes entree {
        from {
          opacity: 0;
          filter: brightness(0);
        }
        to {
          opacity: 1;
          filter: none;
        }
      }
      .calque {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      #fond {
        background: url(assets/maquette-accueil/fond.webp) 0 0/100% 100%;
      }
      .abs {
        position: absolute;
        pointer-events: none;
      }

      /* étoiles qui scintillent */
      .etoile {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 6px 1px #fff8;
        animation: scint var(--d) var(--r) ease-in-out infinite;
      }
      @keyframes scint {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.6);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }
      .filante {
        position: absolute;
        width: 140px;
        height: 2px;
        background: linear-gradient(90deg, #fff0, #fff);
        border-radius: 2px;
        opacity: 0;
        transform: rotate(-18deg);
      }
      .filante.go {
        animation: filante 1.1s ease-out;
      }
      @keyframes filante {
        0% {
          opacity: 0;
          translate: 0 0;
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          translate: -420px 140px;
        }
      }

      /* lune rouge */
      #lune {
        left: 342px;
        top: 47px;
        width: 176px;
        height: 176px;
        border-radius: 50%;
        box-shadow:
          0 0 60px 20px #e0201844,
          0 0 140px 50px #b0101022;
        animation: lune 5s ease-in-out infinite;
      }
      @keyframes lune {
        50% {
          box-shadow:
            0 0 80px 30px #e0201866,
            0 0 180px 70px #b0101033;
        }
      }

      /* lumières : fenêtres, mirador, lanterne */
      .lueur {
        position: absolute;
        border-radius: 50%;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #mirador {
        left: 975px;
        top: 100px;
        width: 62px;
        height: 50px;
        background: radial-gradient(#ffd25a 0, #ffb03055 40%, #0000 70%);
        animation: clign 3.4s steps(1) infinite;
      }
      @keyframes clign {
        0%,
        62%,
        70%,
        100% {
          opacity: 1;
        }
        64%,
        68% {
          opacity: 0.25;
        }
      }
      #maison {
        left: 1095px;
        top: 425px;
        width: 90px;
        height: 90px;
        background: radial-gradient(#ffcf55 0, #ffa02866 35%, #0000 70%);
        animation: feu 2.2s ease-in-out infinite;
      }
      #lanterne {
        left: 1435px;
        top: 190px;
        width: 280px;
        height: 300px;
        background: radial-gradient(#ffd27a88 0, #ff9a2a33 30%, #0000 68%);
        animation: feu 1.3s ease-in-out infinite;
      }
      #lanterne2 {
        left: 1350px;
        top: 300px;
        width: 460px;
        height: 420px;
        background: radial-gradient(#ff9a2a22 0, #0000 65%);
        animation: feu 1.9s ease-in-out infinite reverse;
      }
      @keyframes feu {
        0%,
        100% {
          opacity: 0.85;
          transform: scale(1);
        }
        20% {
          opacity: 1;
          transform: scale(1.04);
        }
        45% {
          opacity: 0.7;
          transform: scale(0.97);
        }
        70% {
          opacity: 0.95;
          transform: scale(1.02);
        }
      }

      /* fumée de la cheminée */
      .fumee {
        position: absolute;
        left: 1104px;
        top: 390px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: radial-gradient(#cfc6bb 0, #cfc6bb88 45%, #0000 70%);
        opacity: 0;
        animation: fumee 5.5s linear infinite;
        animation-delay: var(--d);
      }
      @keyframes fumee {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.5);
        }
        12% {
          opacity: 0.75;
        }
        100% {
          opacity: 0;
          transform: translate(46px, -150px) scale(3.2);
        }
      }

      /* braises et lucioles */
      .braise {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #ffb347;
        box-shadow: 0 0 8px 2px #ff8a1e;
        opacity: 0;
        animation: braise var(--d) var(--r) linear infinite;
      }
      @keyframes braise {
        0% {
          opacity: 0;
          transform: translate(0, 0);
        }
        15% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: translate(var(--x), -260px);
        }
      }

      /* brume qui passe sur la table */
      .brume {
        position: absolute;
        left: -400px;
        width: 2400px;
        height: 300px;
        background: radial-gradient(50% 50% at 50% 50%, #9aa3b11a, #0000 70%);
        animation: brume 38s linear infinite;
      }
      @keyframes brume {
        from {
          transform: translateX(-300px);
        }
        to {
          transform: translateX(300px);
        }
      }

      /* éclair lointain : tout le ciel s’éclaire un instant */
      #eclair {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 420px;
        background: linear-gradient(#b8c6ff33, #0000);
        opacity: 0;
        pointer-events: none;
      }
      #eclair.go {
        animation: eclair 0.9s ease-out;
      }
      @keyframes eclair {
        0% {
          opacity: 0;
        }
        8% {
          opacity: 1;
        }
        16% {
          opacity: 0.2;
        }
        24% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
        }
      }

      /* jetons étoile : petit reflet qui passe */
      .jeton {
        position: absolute;
        width: 118px;
        height: 118px;
        border-radius: 50%;
        overflow: hidden;
        pointer-events: none;
      }
      .jeton::after {
        content: '';
        position: absolute;
        inset: -30%;
        background: linear-gradient(115deg, #0000 40%, #fff6 50%, #0000 60%);
        transform: translateX(-120%);
        animation: reflet 6s ease-in-out infinite;
        animation-delay: var(--d);
      }
      @keyframes reflet {
        0%,
        70% {
          transform: translateX(-120%);
        }
        90%,
        100% {
          transform: translateX(120%);
        }
      }

      /* cartes posées sur la table */
      #table {
        perspective: 1300px;
        perspective-origin: 50% 0;
      }
      .carte {
        position: absolute;
        width: 158px;
        aspect-ratio: 100/146;
        transform-style: preserve-3d;
        transition:
          transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.25),
          filter 0.35s;
        cursor: pointer;
        pointer-events: auto;
      }
      .carte .f,
      .carte .d {
        position: absolute;
        inset: 0;
        border-radius: 7px;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .carte .f {
        background: center/100% 100% no-repeat;
        transform: rotateY(180deg);
      }
      .carte .d {
        background: url(assets/maquette-accueil/dos.webp) center/100% 100%;
        box-shadow: inset 0 0 0 2px #0006;
      }
      .carte .rot {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.3, 1.3, 0.5, 1);
      }
      .ombre {
        position: absolute;
        inset: 6% -2% -6% 4%;
        border-radius: 10px;
        background: #0009;
        filter: blur(8px);
      }
      .carte .rot {
        transform: translateZ(1px);
      }
      .carte.face .rot {
        transform: translateZ(1px) rotateY(180deg);
      }
      .carte:hover,
      .carte.zoom {
        z-index: 20;
        filter: drop-shadow(0 30px 30px #000c);
      }
      .carte .eclat {
        position: absolute;
        inset: 0;
        border-radius: 7px;
        overflow: hidden;
        transform: rotateY(180deg) translateZ(0.5px);
        backface-visibility: hidden;
        pointer-events: none;
      }
      .carte .eclat::after {
        content: '';
        position: absolute;
        inset: -40%;
        background: linear-gradient(110deg, #0000 42%, #fff5 50%, #0000 58%);
        transform: translateX(-130%);
      }
      .carte.brille .eclat::after {
        animation: eclat 1.1s ease-out;
      }
      @keyframes eclat {
        to {
          transform: translateX(130%);
        }
      }

      /* pioche : pile de dos avec épaisseur */
      #pioche {
        position: absolute;
        left: 520px;
        top: 640px;
        width: 170px;
        aspect-ratio: 100/146;
        transform: rotateX(46deg) rotateZ(4deg);
        transform-style: preserve-3d;
        transform-origin: 50% 100%;
      }
      #pioche i {
        position: absolute;
        inset: 0;
        border-radius: 8px;
        background: url(assets/maquette-accueil/dos.webp) center/100% 100%;
        box-shadow: 0 0 0 1px #2a1d10;
      }
      #pioche .tr {
        position: absolute;
        inset: 0;
        border-radius: 8px;
        background: #e8d3a6;
        box-shadow: 0 0 0 1px #2a1d10;
      }
      #pioche .ombreP {
        position: absolute;
        inset: 4% -6% -10% 2%;
        background: #000b;
        filter: blur(10px);
        border-radius: 12px;
      }
      #pioche .haut {
        transition: transform 0.5s;
      }
      #pioche:hover .haut {
        transform: translate3d(6px, -14px, 30px) rotateZ(-4deg);
      }

      /* logo, menu, icônes : placés par le script */
      #logo {
        position: absolute;
        transform-origin: 50% 60%;
        opacity: 0;
        pointer-events: none;
      }
      #logo img {
        width: 100%;
        display: block;
        filter: drop-shadow(0 8px 14px #000c);
      }
      #logo.go {
        animation: logo 1.1s cubic-bezier(0.2, 1.6, 0.4, 1) forwards;
      }
      @keyframes logo {
        0% {
          opacity: 0;
          transform: scale(2.2) rotate(-6deg);
        }
        55% {
          opacity: 1;
          transform: scale(0.94) rotate(1deg);
        }
        75% {
          transform: scale(1.03);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }
      #logo.vit img {
        animation: respire 4s ease-in-out infinite;
      }
      @keyframes respire {
        50% {
          transform: scale(1.015);
          filter: drop-shadow(0 8px 18px #000c) drop-shadow(0 0 18px #e0201855);
        }
      }
      #logo.tremble {
        animation: tremble 0.4s;
      }
      @keyframes tremble {
        20% {
          transform: translate(-4px, 2px) rotate(-0.6deg);
        }
        40% {
          transform: translate(4px, -2px);
        }
        60% {
          transform: translate(-3px, 1px) rotate(0.4deg);
        }
        80% {
          transform: translate(2px, 0);
        }
      }
      #menu {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 0.55em;
      }
      .btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6em;
        width: 92%;
        aspect-ratio: 803/192;
        margin: 0 auto 0 4%;
        background: url(assets/maquette-accueil/plaque.webp) center/100% 100% no-repeat;
        font: 600 1em Oswald;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--creme);
        text-shadow:
          0 2px 0 #000,
          0 0 10px #0008;
        opacity: 0;
        transform: translateX(-60px);
        transition:
          transform 0.18s,
          filter 0.18s;
      }
      .btn.go {
        animation: glisse 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
      }
      @keyframes glisse {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .btn svg {
        width: 1.25em;
        height: 1.25em;
        flex: none;
        fill: var(--creme);
        filter: drop-shadow(0 2px 0 #000);
      }
      .btn span {
        min-width: 6.2em;
        text-align: left;
      }
      .btn.jouer {
        width: 100%;
        margin-left: 0;
        font-size: 1.32em;
        background-image: url(assets/maquette-accueil/plaque-rouge.webp);
      }
      .btn.jouer.vit {
        animation: none;
        opacity: 1;
        transform: none;
      }
      .btn.jouer.vit::after {
        content: '';
        position: absolute;
        inset: 6% 4%;
        border-radius: 4px;
        box-shadow: 0 0 22px 4px #ff3a2a55;
        animation: pouls 2.2s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes pouls {
        50% {
          box-shadow: 0 0 34px 10px #ff3a2a88;
        }
      }
      .btn.go:hover,
      .btn.vit:hover {
        transform: translateX(8px) scale(1.03);
        filter: brightness(1.18);
      }
      .btn:active {
        transform: scale(0.97) !important;
        filter: brightness(0.9);
      }
      .btn::before {
        content: '';
        position: absolute;
        inset: 8% 3%;
        border-radius: 4px;
        overflow: hidden;
        background: linear-gradient(105deg, #0000 40%, #fff3 50%, #0000 60%) -200% 0/200% 100% no-repeat;
        transition: background-position 0.6s;
        pointer-events: none;
      }
      .btn:hover::before {
        background-position: 200% 0;
      }

      #icones {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: 14px;
        display: flex;
        gap: 10px;
        z-index: 30;
      }
      .ico {
        width: clamp(42px, 4.2vw, 62px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        background: #120e0c;
        border: 2px solid var(--or);
        box-shadow:
          inset 0 0 0 2px #000,
          0 4px 10px #000a;
        clip-path: polygon(14% 0, 86% 0, 100% 14%, 100% 86%, 86% 100%, 14% 100%, 0 86%, 0 14%);
        opacity: 0;
        transform: translateY(-20px);
        transition:
          transform 0.2s,
          filter 0.2s;
      }
      .ico.go {
        animation: glisse 0.5s ease-out forwards;
      }
      .ico svg {
        width: 56%;
        height: 56%;
        fill: var(--creme);
      }
      .ico:hover {
        filter: brightness(1.3);
      }

      /* toast de la maquette */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translate(-50%, 30px);
        opacity: 0;
        background: #120e0ccc;
        border: 1px solid var(--or);
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        transition: 0.3s;
        z-index: 40;
        pointer-events: none;
        white-space: nowrap;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #voile {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 50;
        transition: opacity 0.5s;
      }
      #voile.on {
        opacity: 1;
      }

      /* portrait (téléphone) : logo en haut, scène au milieu, boutons dessous */
      body.portrait #menu {
        gap: 12px;
      }
      body.portrait #scene {
        -webkit-mask-image: linear-gradient(#0000 0, #000 22%);
        mask-image: linear-gradient(#0000 0, #000 22%);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="flou"></div>
    <div id="scene">
      <div class="calque" id="fond"></div>
      <div class="calque" id="ciel"><div id="eclair"></div></div>
      <div class="calque" id="lumieres">
        <div class="lueur" id="mirador"></div>
        <div class="lueur" id="maison"></div>
        <div class="lueur" id="lanterne2"></div>
        <div class="lueur" id="lanterne"></div>
        <div class="jeton" style="left: 1266px; top: 770px; --d: 1s"></div>
        <div class="jeton" style="left: 1378px; top: 798px; --d: 1.6s"></div>
      </div>
      <div class="calque" id="table">
        <div id="pioche"></div>
      </div>
      <div class="calque" style="pointer-events: none">
        <div class="brume" style="top: 600px"></div>
        <div
          class="brume"
          style="top: 700px; animation-duration: 55s; animation-direction: reverse; opacity: 0.7"
        ></div>
      </div>
    </div>

    <div id="logo"><img src="assets/maquette-accueil/logo.webp" alt="Barricard" /></div>
    <nav id="menu">
      <button class="btn jouer" data-msg="Jouer : lancement d’une partie">
        <svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" /></svg><span>Jouer</span>
      </button>
      <button class="btn" data-msg="Collection">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="10" height="15" rx="1.6" transform="rotate(-14 8 12.5)" />
          <rect
            x="10.5"
            y="4"
            width="10"
            height="15"
            rx="1.6"
            transform="rotate(10 15.5 11.5)"
            stroke="#1a0f0c"
            stroke-width="1.8"
          /></svg
        ><span>Collection</span>
      </button>
      <button class="btn" data-msg="Progression">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2l5 2.6v5.2l-5 2.6-5-2.6V4.6zM6.5 11.3l5 2.6v5.4l-5 2.6-5-2.6v-5.4zM17.5 11.3l5 2.6v5.4l-5 2.6-5-2.6v-5.4z"
          /></svg
        ><span>Progression</span>
      </button>
      <button class="btn" data-msg="Options">
        <svg viewBox="0 0 24 24">
          <path
            id="roue"
            d="M10.3 2h3.4l.5 2.6 1.9.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.9 2.6.5v3.4l-2.6.5-.8 1.9 1.5 2.2-2.4 2.4-2.2-1.5-1.9.8-.5 2.6h-3.4l-.5-2.6-1.9-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.9L2 13.7v-3.4l2.6-.5.8-1.9-1.5-2.2 2.4-2.4 2.2 1.5 1.9-.8zM12 8.2a3.8 3.8 0 100 7.6 3.8 3.8 0 000-7.6z"
            fill-rule="evenodd"
          /></svg
        ><span>Options</span>
      </button>
    </nav>
    <div id="icones">
      <button class="ico" data-msg="Statistiques">
        <svg viewBox="0 0 24 24"><path d="M3 15h4v6H3zM10 10h4v11h-4zM17 4h4v17h-4z" /></svg>
      </button>
      <button class="ico" data-msg="Succès">
        <svg viewBox="0 0 24 24">
          <path
            d="M7 3h10v2h4v3a5 5 0 01-4.6 5A5 5 0 0113 15.9V18h3v3H8v-3h3v-2.1A5 5 0 017.6 13 5 5 0 013 8V5h4zm10 4v4a3 3 0 002-3V7zM5 7v1a3 3 0 002 3V7z"
          />
        </svg>
      </button>
      <button class="ico" data-msg="Options">
        <svg viewBox="0 0 24 24"><use href="#roue" /></svg>
      </button>
    </div>
    <div id="toast"></div>
    <div id="voile"></div>

    <script>
      'use strict';
      const W = 1672,
        H = 941;
      const $ = s => document.querySelector(s);
      const scene = $('#scene'),
        logo = $('#logo'),
        menu = $('#menu');
      const MAQ = 'assets/maquette-accueil/';

      // --- Cartes de la main : les vraies cartes du jeu, à l'endroit des cartes peintes ---
      const MAIN = [
        { id: 'gun', x: 718, y: 690, rz: 4 },
        { id: 'bar', x: 868, y: 700, rz: 3 },
        { id: 'medkit', x: 1022, y: 708, rz: 6 },
      ];
      const POSE = 'rotateX(46deg)';
      const table = $('#table');
      // pioche : 8 dos empilés vers le bas pour montrer l'épaisseur
      const pioche = $('#pioche');
      pioche.innerHTML =
        '<div class="ombreP"></div>' +
        Array.from(
          { length: 8 },
          (_, i) => `<div class="tr" style="transform:translate3d(0,${(8 - i) * 2.2}px,${-(8 - i) * 1.4}px)"></div>`,
        ).join('') +
        '<i class="haut"></i>';

      const cartes = MAIN.map((c, i) => {
        const el = document.createElement('div');
        el.className = 'carte';
        el.innerHTML = `<div class="ombre"></div><div class="rot"><div class="d"></div><div class="f" style="background-image:url(${MAQ}carte-${c.id}.webp)"></div><div class="eclat"></div></div>`;
        el.style.left = c.x + 'px';
        el.style.top = c.y + 'px';
        el.style.transformOrigin = '50% 100%';
        // départ : sur la pioche, face cachée
        const dx = 525 - c.x,
          dy = 650 - c.y;
        el.dataset.repos = `${POSE} rotateZ(${c.rz}deg)`;
        el.style.transform = `translate3d(${dx}px,${dy}px,${10 + i}px) ${POSE} rotateZ(4deg)`;
        el.style.opacity = '0';
        table.appendChild(el);
        // survol / toucher : la carte se lève vers le joueur pour être lue
        const leve = () => {
          el.style.transform = `translate3d(0,-150px,120px) rotateX(0deg) rotateZ(0deg) scale(1.45)`;
        };
        const repose = () => {
          el.classList.remove('zoom');
          el.style.transform = el.dataset.repos;
        };
        el.addEventListener(
          'mouseenter',
          () => matchMedia('(hover:hover)').matches && el.classList.contains('posee') && leve(),
        );
        el.addEventListener(
          'mouseleave',
          () => el.classList.contains('posee') && !el.classList.contains('zoom') && repose(),
        );
        el.addEventListener('click', e => {
          e.stopPropagation();
          if (!el.classList.contains('posee')) return;
          if (el.classList.toggle('zoom')) {
            cartes.forEach(o => o !== el && o.classList.contains('zoom') && o.click());
            leve();
          } else repose();
        });
        return el;
      });
      document.addEventListener('click', () => cartes.forEach(c => c.classList.contains('zoom') && c.click()));

      // distribution : chaque carte part de la pioche, se retourne et se pose
      function distribuer() {
        cartes.forEach((el, i) =>
          setTimeout(() => {
            el.style.opacity = '1';
            el.style.transition = 'transform .75s cubic-bezier(.25,1.2,.4,1)';
            el.style.transform = `translate3d(0,-60px,80px) rotateX(20deg) rotateZ(${MAIN[i].rz}deg)`;
            pioche.animate(
              [
                { transform: 'rotateX(46deg) rotateZ(4deg)' },
                { transform: 'rotateX(46deg) rotateZ(4deg) translateY(4px)' },
                { transform: 'rotateX(46deg) rotateZ(4deg)' },
              ],
              220,
            );
            setTimeout(() => el.classList.add('face'), 180);
            setTimeout(() => {
              el.style.transform = el.dataset.repos;
            }, 650);
            setTimeout(() => {
              el.style.transition = '';
              el.classList.add('posee');
              briller(el);
            }, 1100);
          }, i * 260),
        );
      }
      function briller(el) {
        el.classList.remove('brille');
        void el.offsetWidth;
        el.classList.add('brille');
      }
      // de temps en temps, un reflet passe sur une carte
      setInterval(() => {
        const c = cartes[Math.floor(Math.random() * 3)];
        if (c.classList.contains('posee')) briller(c);
      }, 4200);

      // --- Ciel : étoiles, étoiles filantes, éclairs ---
      const ciel = $('#ciel');
      for (let i = 0; i < 46; i++) {
        const s = document.createElement('div');
        s.className = 'etoile';
        const x = Math.random() * W,
          y = Math.random() * 230;
        if (x < 640 && y < 320) {
          i--;
          continue;
        } // le logo couvre ce coin
        s.style.cssText = `left:${x}px;top:${y}px;--d:${2 + Math.random() * 4}s;--r:-${Math.random() * 5}s;width:${2 + Math.random() * 2.5}px;height:${2 + Math.random() * 2.5}px`;
        ciel.appendChild(s);
      }
      const filante = document.createElement('div');
      filante.className = 'filante';
      ciel.appendChild(filante);
      setInterval(() => {
        filante.style.left = 900 + Math.random() * 650 + 'px';
        filante.style.top = 20 + Math.random() * 90 + 'px';
        filante.classList.remove('go');
        void filante.offsetWidth;
        filante.classList.add('go');
      }, 7000);
      const eclair = $('#eclair');
      (function orage() {
        setTimeout(
          () => {
            eclair.classList.remove('go');
            void eclair.offsetWidth;
            eclair.classList.add('go');
            orage();
          },
          9000 + Math.random() * 9000,
        );
      })();

      // --- Fumée de la cheminée et braises de la lanterne ---
      const lum = $('#lumieres');
      for (let i = 0; i < 7; i++) {
        const f = document.createElement('div');
        f.className = 'fumee';
        f.style.setProperty('--d', -i * 0.8 + 's');
        lum.appendChild(f);
      }
      for (let i = 0; i < 18; i++) {
        const b = document.createElement('div');
        b.className = 'braise';
        const autourLanterne = i < 7;
        b.style.cssText = autourLanterne
          ? `left:${1555 + Math.random() * 40}px;top:${330 + Math.random() * 30}px;--d:${3 + Math.random() * 3}s;--r:-${Math.random() * 6}s;--x:${-30 + Math.random() * 60}px`
          : `left:${560 + Math.random() * 900}px;top:${300 + Math.random() * 300}px;--d:${6 + Math.random() * 6}s;--r:-${Math.random() * 12}s;--x:${-80 + Math.random() * 160}px;background:#e9ff9a;box-shadow:0 0 8px 2px #c8ff5a88;width:3px;height:3px`;
        lum.appendChild(b);
      }

      // --- Mise en page : la scène couvre l'écran (paysage) ou se place au milieu (portrait) ---
      let echelle = 1,
        ox = 0,
        oy = 0,
        portrait = false;
      function placer() {
        const vw = innerWidth,
          vh = innerHeight;
        portrait = vw / vh < 1.05;
        document.body.classList.toggle('portrait', portrait);
        if (!portrait) {
          // couvre l'écran, sans jamais couper le menu à gauche ni le logo en haut
          echelle = Math.min(Math.max(vw / W, vh / H), vw / 1600, vh / 880);
          ox = (vw - W * echelle) / 2;
          oy = (vh - H * echelle) / 2;
          if (ox < 0) ox = Math.max(ox, vw - W * echelle); // garde la droite (lanterne) si on rogne
          // logo et boutons aux positions de la maquette de l'artiste
          poser(logo, 40, 70, 565);
          poser(menu, 50, 340, 460);
          menu.style.fontSize = 34 * echelle + 'px';
        } else {
          // portrait : la scène montre le plateau et les cartes (x 470 à 1500)
          echelle = vw / 1040;
          ox = -470 * echelle;
          const hautMenu = Math.min(vh * 0.42, 350);
          oy = vh - hautMenu - 945 * echelle;
          const lw = Math.min(vw - 60, 400);
          logo.style.cssText += `;left:${(vw - lw) / 2}px;top:${Math.max(66, oy + 90 * echelle - lw * 0.36 - 6)}px;width:${lw}px`;
          const mw = Math.min(vw - 70, 310);
          menu.style.left = (vw - mw) / 2 + 'px';
          menu.style.width = mw + 'px';
          menu.style.top = vh - hautMenu + 'px';
          menu.style.fontSize = Math.min(23, mw / 13.5) + 'px';
        }
        scene.style.transform = `translate(${ox}px,${oy}px) scale(${echelle})`;
      }
      function poser(el, x, y, w) {
        el.style.left = ox + x * echelle + 'px';
        el.style.top = oy + y * echelle + 'px';
        el.style.width = w * echelle + 'px';
      }
      addEventListener('resize', placer);
      placer();

      // --- Parallaxe à la souris (PC) ---
      const calques = [
        ['#fond', 4],
        ['#ciel', 9],
        ['#lumieres', 5],
        ['#table', 12],
      ].map(([s, f]) => [$(s), f]);
      addEventListener('mousemove', e => {
        if (portrait) return;
        const nx = e.clientX / innerWidth - 0.5,
          ny = e.clientY / innerHeight - 0.5;
        calques.forEach(([el, f]) => {
          el.style.transform = `translate(${-nx * f}px,${-ny * f}px)`;
        });
      });

      // --- Entrée : logo, boutons, icônes, puis distribution des cartes ---
      setTimeout(() => {
        logo.classList.add('go');
      }, 700);
      setTimeout(() => {
        logo.classList.remove('go');
        logo.style.opacity = 1;
        logo.classList.add('vit');
      }, 1850);
      document.querySelectorAll('.btn').forEach((b, i) => setTimeout(() => b.classList.add('go'), 1300 + i * 120));
      setTimeout(() => {
        const j = $('.btn.jouer');
        j.classList.remove('go');
        j.classList.add('vit');
      }, 2000);
      document.querySelectorAll('.ico').forEach((b, i) => setTimeout(() => b.classList.add('go'), 1600 + i * 100));
      setTimeout(distribuer, 1900);
      // le logo tremble à chaque éclair
      new MutationObserver(() => {
        if (eclair.classList.contains('go')) {
          logo.classList.remove('tremble');
          void logo.offsetWidth;
          logo.classList.add('tremble');
        }
      }).observe(eclair, { attributes: true, attributeFilter: ['class'] });

      // --- Boutons : simple message (maquette) ; Jouer fait un fondu au noir ---
      const toast = $('#toast');
      let tt;
      document.querySelectorAll('[data-msg]').forEach(b =>
        b.addEventListener('click', e => {
          e.stopPropagation();
          toast.textContent = b.dataset.msg + ' (maquette)';
          toast.classList.add('on');
          clearTimeout(tt);
          tt = setTimeout(() => toast.classList.remove('on'), 1600);
          if (b.classList.contains('jouer')) {
            const v = $('#voile');
            v.classList.add('on');
            setTimeout(() => v.classList.remove('on'), 1100);
          }
        }),
      );
    </script>
  </body>
</html>

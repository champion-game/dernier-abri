<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Barricard – maquette de l’accueil</title>
    <!-- Maquette autonome de l’écran d’accueil : rien ici n’est branché au jeu. Images dans assets/maquette-accueil/.
     Les boutons sont ceux de l’accueil actuel (Jouer, Collection et decks, Défi du jour, barre du bas, roue dentée) ;
     seuls Jouer, Collection et Défi prennent le nouveau style de plaque. -->
    <style>
      @font-face {
        font-family: Oswald;
        src: url(assets/fonts/oswald-600.woff2) format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: Atkinson;
        src: url(assets/fonts/atkinson-400.woff2) format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      :root {
        --creme: #f1e4c8;
        --or: #c9a46a;
        --nuit: #0c0a0b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--nuit);
        color: var(--creme);
        font-family: Atkinson, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      #flou {
        position: fixed;
        inset: -40px;
        background: url(assets/maquette-accueil/fond.webp) center/cover;
        filter: blur(18px) brightness(0.45);
      }
      #scene {
        position: absolute;
        left: 0;
        top: 0;
        width: 1672px;
        height: 941px;
        transform-origin: 0 0;
        opacity: 0;
        animation: entree 1.6s 0.1s ease-out forwards;
      }
      @keyframes entree {
        from {
          opacity: 0;
          filter: brightness(0);
        }
        to {
          opacity: 1;
          filter: none;
        }
      }
      .calque {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #fond {
        background: url(assets/maquette-accueil/fond.webp) 0 0/100% 100%;
      }

      /* ciel */
      .etoile {
        position: absolute;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 6px 1px #fff8;
        animation: scint var(--d) var(--r) ease-in-out infinite;
      }
      @keyframes scint {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.6);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }
      .filante {
        position: absolute;
        width: 140px;
        height: 2px;
        background: linear-gradient(90deg, #fff0, #fff);
        border-radius: 2px;
        opacity: 0;
        transform: rotate(-18deg);
      }
      .filante.go {
        animation: filante 1.1s ease-out;
      }
      @keyframes filante {
        0% {
          opacity: 0;
          translate: 0 0;
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          translate: -420px 140px;
        }
      }
      #eclair {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 420px;
        background: linear-gradient(#b8c6ff33, #0000);
        opacity: 0;
      }
      #eclair.go {
        animation: eclair 0.9s ease-out;
      }
      @keyframes eclair {
        0% {
          opacity: 0;
        }
        8% {
          opacity: 1;
        }
        16% {
          opacity: 0.2;
        }
        24% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
        }
      }

      /* lumières */
      .lueur {
        position: absolute;
        border-radius: 50%;
        mix-blend-mode: screen;
      }
      #mirador {
        left: 975px;
        top: 100px;
        width: 62px;
        height: 50px;
        background: radial-gradient(#ffd25a 0, #ffb03055 40%, #0000 70%);
        animation: clign 3.4s steps(1) infinite;
      }
      @keyframes clign {
        0%,
        62%,
        70%,
        100% {
          opacity: 1;
        }
        64%,
        68% {
          opacity: 0.25;
        }
      }
      #maison {
        left: 1095px;
        top: 425px;
        width: 90px;
        height: 90px;
        background: radial-gradient(#ffcf55 0, #ffa02866 35%, #0000 70%);
        animation: feu 2.2s ease-in-out infinite;
      }
      #lanterne {
        left: 1435px;
        top: 190px;
        width: 280px;
        height: 300px;
        background: radial-gradient(#ffd27a88 0, #ff9a2a33 30%, #0000 68%);
        animation: feu 1.3s ease-in-out infinite;
      }
      #lanterne2 {
        left: 1350px;
        top: 300px;
        width: 460px;
        height: 420px;
        background: radial-gradient(#ff9a2a22 0, #0000 65%);
        animation: feu 1.9s ease-in-out infinite reverse;
      }
      @keyframes feu {
        0%,
        100% {
          opacity: 0.85;
          transform: scale(1);
        }
        20% {
          opacity: 1;
          transform: scale(1.04);
        }
        45% {
          opacity: 0.7;
          transform: scale(0.97);
        }
        70% {
          opacity: 0.95;
          transform: scale(1.02);
        }
      }
      .fumee {
        position: absolute;
        left: 1104px;
        top: 390px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: radial-gradient(#cfc6bb 0, #cfc6bb88 45%, #0000 70%);
        opacity: 0;
        animation: fumee 5.5s linear infinite;
        animation-delay: var(--d);
      }
      @keyframes fumee {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.5);
        }
        12% {
          opacity: 0.75;
        }
        100% {
          opacity: 0;
          transform: translate(46px, -150px) scale(3.2);
        }
      }
      .braise {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #ffb347;
        box-shadow: 0 0 8px 2px #ff8a1e;
        opacity: 0;
        animation: braise var(--d) var(--r) linear infinite;
      }
      @keyframes braise {
        0% {
          opacity: 0;
          transform: translate(0, 0);
        }
        15% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: translate(var(--x), -260px);
        }
      }
      .brume {
        position: absolute;
        left: -400px;
        width: 2400px;
        height: 300px;
        background: radial-gradient(50% 50% at 50% 50%, #9aa3b11a, #0000 70%);
        animation: brume 38s linear infinite;
      }
      @keyframes brume {
        from {
          transform: translateX(-300px);
        }
        to {
          transform: translateX(300px);
        }
      }
      .jeton {
        position: absolute;
        width: 118px;
        height: 118px;
        border-radius: 50%;
        overflow: hidden;
      }
      .jeton::after {
        content: '';
        position: absolute;
        inset: -30%;
        background: linear-gradient(115deg, #0000 40%, #fff6 50%, #0000 60%);
        transform: translateX(-120%);
        animation: reflet 6s ease-in-out infinite;
        animation-delay: var(--d);
      }
      @keyframes reflet {
        0%,
        70% {
          transform: translateX(-120%);
        }
        90%,
        100% {
          transform: translateX(120%);
        }
      }

      /* reflet sur les cartes du dessin (même forme que chaque carte, matrice calculée par le script) */
      .reflet {
        position: absolute;
        left: 0;
        top: 0;
        width: 158px;
        height: 231px;
        transform-origin: 0 0;
        border-radius: 10px;
        overflow: hidden;
      }
      .reflet::after {
        content: '';
        position: absolute;
        inset: -40%;
        background: linear-gradient(110deg, #0000 42%, #fff4 50%, #0000 58%);
        transform: translateX(-130%);
      }
      .reflet.go::after {
        animation: eclat 1.2s ease-out;
      }
      @keyframes eclat {
        to {
          transform: translateX(130%);
        }
      }

      /* logo et menu (placés par le script) */
      #logo {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      #logo img {
        width: 100%;
        display: block;
        filter: drop-shadow(0 8px 14px #000c);
      }
      #logo.go {
        animation: logo 1.1s cubic-bezier(0.2, 1.6, 0.4, 1) forwards;
      }
      @keyframes logo {
        0% {
          opacity: 0;
          transform: scale(2.2) rotate(-6deg);
        }
        55% {
          opacity: 1;
          transform: scale(0.94) rotate(1deg);
        }
        75% {
          transform: scale(1.03);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }
      #logo.vit img {
        animation: respire 4s ease-in-out infinite;
      }
      @keyframes respire {
        50% {
          transform: scale(1.015);
          filter: drop-shadow(0 8px 18px #000c) drop-shadow(0 0 18px #e0201855);
        }
      }
      #logo.tremble {
        animation: tremble 0.4s;
      }
      @keyframes tremble {
        20% {
          transform: translate(-4px, 2px) rotate(-0.6deg);
        }
        40% {
          transform: translate(4px, -2px);
        }
        60% {
          transform: translate(-3px, 1px) rotate(0.4deg);
        }
        80% {
          transform: translate(2px, 0);
        }
      }

      #menu {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.45em;
      }
      .apparait {
        opacity: 0;
        transform: translateX(-50px);
      }
      .apparait.go {
        animation: glisse 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
      }
      @keyframes glisse {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .tag {
        display: flex;
        align-items: center;
        gap: 0.6em;
        margin: 0 0 0.3em;
        font-size: 0.5em;
        white-space: nowrap;
        text-align: center;
        text-shadow: 0 2px 4px #000;
      }
      .tag i {
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, #0000, var(--or), #0000);
      }
      .info {
        margin: 0.2em 0 0;
        font-size: 0.5em;
        text-align: center;
        line-height: 1.35;
        text-shadow: 0 2px 4px #000;
      }
      .btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.55em;
        width: 100%;
        aspect-ratio: 803/192;
        background: url(assets/maquette-accueil/plaque.webp) center/100% 100% no-repeat;
        font: 600 0.78em Oswald;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--creme);
        text-shadow:
          0 2px 0 #000,
          0 0 10px #0008;
        transition:
          transform 0.18s,
          filter 0.18s;
      }
      .btn svg {
        width: 1.2em;
        height: 1.2em;
        flex: none;
        fill: var(--creme);
        filter: drop-shadow(0 2px 0 #000);
      }
      .btn.jouer {
        font-size: 1.15em;
        background-image: url(assets/maquette-accueil/plaque-rouge.webp);
      }
      .btn.jouer::after {
        content: '';
        position: absolute;
        inset: 8% 4%;
        border-radius: 4px;
        box-shadow: 0 0 22px 4px #ff3a2a44;
        animation: pouls 2.2s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes pouls {
        50% {
          box-shadow: 0 0 34px 10px #ff3a2a88;
        }
      }
      .btn:hover {
        transform: translateX(6px) scale(1.03);
        filter: brightness(1.18);
      }
      .btn:active {
        transform: scale(0.97);
        filter: brightness(0.9);
      }
      .btn::before {
        content: '';
        position: absolute;
        inset: 10% 3%;
        border-radius: 4px;
        background: linear-gradient(105deg, #0000 40%, #fff3 50%, #0000 60%) -200% 0/200% 100% no-repeat;
        transition: background-position 0.6s;
        pointer-events: none;
      }
      .btn:hover::before {
        background-position: 200% 0;
      }

      /* barre du bas et roue dentée : style actuel du jeu (panneau noir) */
      #barre {
        position: fixed;
        left: 50%;
        bottom: max(2vh, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        width: min(60vw, 780px);
        border-image: url(assets/art/ui/panneau-noir.webp) 36 fill / 10px stretch;
        filter: drop-shadow(0 6px 10px #000c);
        z-index: 30;
        opacity: 0;
        transition: opacity 0.6s;
      }
      #barre.go {
        opacity: 1;
      }
      .tab {
        flex: 1 1 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 0;
        padding: 9px 6px;
        border-left: 1px solid #c9a46a66;
        font: 600 clamp(13px, 1.15vw, 16px) Oswald;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .tab:first-child {
        border-left: 0;
      }
      .tab:hover {
        color: #ffd88a;
      }
      .tab svg {
        width: 21px;
        height: 21px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tab.cr {
        flex: 0.6 1 0;
        font: 400 14px Atkinson;
        text-transform: none;
        letter-spacing: 0;
      }
      #roue {
        position: fixed;
        top: max(2vh, env(safe-area-inset-top));
        right: 1.5vw;
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border-image: url(assets/art/ui/panneau-noir.webp) 36 fill / 8px stretch;
        filter: drop-shadow(0 6px 10px #000c);
        z-index: 30;
      }
      #roue svg {
        width: 28px;
        height: 28px;
        fill: none;
        stroke: var(--creme);
        stroke-width: 2;
      }
      #roue:hover {
        filter: brightness(1.35);
      }
      #ver {
        position: fixed;
        right: 10px;
        bottom: 6px;
        margin: 0;
        font-size: 11px;
        opacity: 0.6;
        z-index: 30;
      }

      #toast {
        position: fixed;
        left: 50%;
        top: 70px;
        transform: translate(-50%, -20px);
        opacity: 0;
        background: #120e0ccc;
        border: 1px solid var(--or);
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        transition: 0.3s;
        z-index: 40;
        pointer-events: none;
        white-space: nowrap;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* téléphone en portrait : onglets icône au-dessus du texte, comme dans le jeu */
      body.portrait #barre {
        width: calc(100vw - 32px);
      }
      body.portrait .tab {
        flex-direction: column;
        gap: 4px;
        padding: 8px 2px;
        font-size: 12px;
      }
      body.portrait .tab.cr {
        display: none;
      }
      body.portrait #ver {
        display: none;
      }
      body.portrait #scene {
        -webkit-mask-image: linear-gradient(#0000 0, #000 22%);
        mask-image: linear-gradient(#0000 0, #000 22%);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="flou"></div>
    <div id="scene">
      <div class="calque" id="fond"></div>
      <div class="calque" id="ciel"><div id="eclair"></div></div>
      <div class="calque" id="lumieres">
        <div class="lueur" id="mirador"></div>
        <div class="lueur" id="maison"></div>
        <div class="lueur" id="lanterne2"></div>
        <div class="lueur" id="lanterne"></div>
        <div class="jeton" style="left: 1266px; top: 770px; --d: 1s"></div>
        <div class="jeton" style="left: 1378px; top: 798px; --d: 1.6s"></div>
      </div>
      <div class="calque" id="table"></div>
      <div class="calque">
        <div class="brume" style="top: 600px"></div>
        <div
          class="brume"
          style="top: 700px; animation-duration: 55s; animation-direction: reverse; opacity: 0.7"
        ></div>
      </div>
    </div>

    <div id="logo"><img src="assets/maquette-accueil/logo.webp" alt="Barricard" /></div>
    <nav id="menu">
      <p class="tag apparait"><i></i>Tiens 30 nuits jusqu’à l’arrivée des secours.<i></i></p>
      <button class="btn jouer apparait" data-msg="Jouer">Jouer</button>
      <button class="btn apparait" data-msg="Collection et decks">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="10" height="15" rx="1.6" transform="rotate(-14 8 12.5)" />
          <rect
            x="10.5"
            y="4"
            width="10"
            height="15"
            rx="1.6"
            transform="rotate(10 15.5 11.5)"
            stroke="#1a0f0c"
            stroke-width="1.8"
          /></svg
        >Collection et decks
      </button>
      <button class="btn apparait" data-msg="Défi du jour">
        <svg viewBox="0 0 24 24">
          <path
            d="M7 2h2v2h6V2h2v2h2.5A1.5 1.5 0 0121 5.5v14a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 19.5v-14A1.5 1.5 0 014.5 4H7zM5 9v10h14V9zm2 2h3v3H7zm4.5 0h3v3h-3zm4.5 0h3v3h-3zm-9 4.5h3V18H7zm4.5 0h3V18h-3z"
            fill-rule="evenodd"
          /></svg
        >Défi du jour
      </button>
      <p class="info apparait">Prochain déblocage : La policière dans 8 nuits au total.</p>
    </nav>
    <nav id="barre">
      <button class="tab" data-msg="Règles">
        <svg viewBox="0 0 24 24">
          <path d="M3 5c3-1.5 6-1.5 9 0v15c-3-1.5-6-1.5-9 0zM21 5c-3-1.5-6-1.5-9 0v15c3-1.5 6-1.5 9 0z" /></svg
        ><span>Règles</span>
      </button>
      <button class="tab" data-msg="Bestiaire">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 3c-4.4 0-7.5 3-7.5 7 0 2.4 1.1 4 2.5 5v3h10v-3c1.4-1 2.5-2.6 2.5-5 0-4-3.1-7-7.5-7zM9 18v3M12 18v3M15 18v3"
          />
          <circle cx="9" cy="11" r="1.6" />
          <circle cx="15" cy="11" r="1.6" /></svg
        ><span>Bestiaire</span>
      </button>
      <button class="tab" data-msg="Stats">
        <svg viewBox="0 0 24 24"><path d="M5 20v-6M10 20V9M15 20v-8M20 20V5M3 20h19" /></svg><span>Stats</span>
      </button>
      <button class="tab" data-msg="Succès">
        <svg viewBox="0 0 24 24">
          <path d="M7 4h10v5a5 5 0 01-10 0zM7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3M12 14v4M8 21h8M9 18h6" /></svg
        ><span>Succès 0/28</span>
      </button>
      <button class="tab cr" data-msg="Crédits">Crédits</button>
    </nav>
    <button id="roue" data-msg="Options" aria-label="Options">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.2" />
        <path
          d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3"
        />
        <circle cx="12" cy="12" r="6.6" />
      </svg>
    </button>
    <p id="ver">maquette · accueil</p>
    <div id="toast"></div>

    <script>
      'use strict';
      const W = 1672,
        H = 941,
        CW = 158,
        CH = 231;
      const $ = s => document.querySelector(s);
      const scene = $('#scene'),
        logo = $('#logo'),
        menu = $('#menu'),
        table = $('#table');
      const MAQ = 'assets/maquette-accueil/';

      /* Coins (haut-gauche, haut-droit, bas-gauche) des cartes peintes, mesurés sur l'image 1672 × 941.
   Chaque vraie carte reçoit la matrice qui l'envoie sur ces trois coins : même perspective que le dessin. */
      const COINS = {
        pioche: [
          [595, 640],
          [750, 660],
          [482, 790],
        ],
        gun: [
          [775, 717],
          [927, 725],
          [705, 887],
        ],
        bar: [
          [920, 732],
          [1062, 737],
          [857, 892],
        ],
        medkit: [
          [1057, 737],
          [1222, 755],
          [992, 902],
        ],
      };
      const matrice = ([tl, tr, bl], dx = 0, dy = 0) =>
        `matrix(${(tr[0] - tl[0]) / CW},${(tr[1] - tl[1]) / CW},${(bl[0] - tl[0]) / CH},${(bl[1] - tl[1]) / CH},${tl[0] + dx},${tl[1] + dy})`;

      function creer(cls, html = '') {
        const el = document.createElement('div');
        el.className = cls;
        el.innerHTML = html;
        table.appendChild(el);
        return el;
      }
      // la pioche est celle du dessin : les cartes partent de sa carte du dessus

      // cartes du dessin : un reflet passe de temps en temps sur l'une d'elles
      const reflets = ['pioche', 'gun', 'bar', 'medkit'].map(id => {
        const el = creer('reflet');
        el.style.transform = matrice(COINS[id]);
        return el;
      });
      setInterval(() => {
        const el = reflets[Math.floor(Math.random() * reflets.length)];
        el.classList.remove('go');
        void el.offsetWidth;
        el.classList.add('go');
      }, 2600);

      // --- Ciel : étoiles, étoiles filantes, éclairs ---
      const ciel = $('#ciel');
      for (let i = 0; i < 46; i++) {
        const x = Math.random() * W,
          y = Math.random() * 230;
        if (x < 640 && y < 320) {
          i--;
          continue;
        } // coin du logo
        const s = document.createElement('div');
        const t = 2 + Math.random() * 2.5;
        s.className = 'etoile';
        s.style.cssText = `left:${x}px;top:${y}px;width:${t}px;height:${t}px;--d:${2 + Math.random() * 4}s;--r:-${Math.random() * 5}s`;
        ciel.appendChild(s);
      }
      const filante = document.createElement('div');
      filante.className = 'filante';
      ciel.appendChild(filante);
      setInterval(() => {
        filante.style.left = 900 + Math.random() * 650 + 'px';
        filante.style.top = 20 + Math.random() * 90 + 'px';
        filante.classList.remove('go');
        void filante.offsetWidth;
        filante.classList.add('go');
      }, 7000);
      const eclair = $('#eclair');
      (function orage() {
        setTimeout(
          () => {
            eclair.classList.remove('go');
            void eclair.offsetWidth;
            eclair.classList.add('go');
            if (logo.classList.contains('vit')) {
              logo.classList.remove('tremble');
              void logo.offsetWidth;
              logo.classList.add('tremble');
            }
            orage();
          },
          9000 + Math.random() * 9000,
        );
      })();

      // --- Fumée et braises ---
      const lum = $('#lumieres');
      for (let i = 0; i < 7; i++) {
        const f = document.createElement('div');
        f.className = 'fumee';
        f.style.setProperty('--d', -i * 0.8 + 's');
        lum.appendChild(f);
      }
      for (let i = 0; i < 18; i++) {
        const b = document.createElement('div');
        b.className = 'braise';
        b.style.cssText =
          i < 7
            ? `left:${1555 + Math.random() * 40}px;top:${330 + Math.random() * 30}px;--d:${3 + Math.random() * 3}s;--r:-${Math.random() * 6}s;--x:${-30 + Math.random() * 60}px`
            : `left:${560 + Math.random() * 900}px;top:${300 + Math.random() * 300}px;--d:${6 + Math.random() * 6}s;--r:-${Math.random() * 12}s;--x:${-80 + Math.random() * 160}px;background:#e9ff9a;box-shadow:0 0 8px 2px #c8ff5a88;width:3px;height:3px`;
        lum.appendChild(b);
      }

      // --- Mise en page (l'écran ne bouge pas avec la souris) ---
      let echelle = 1,
        ox = 0,
        oy = 0;
      function placer() {
        const vw = innerWidth,
          vh = innerHeight;
        const portrait = vw / vh < 1.05;
        document.body.classList.toggle('portrait', portrait);
        if (!portrait) {
          // la scène couvre l'écran sans couper le menu à gauche ni le logo en haut
          echelle = Math.min(Math.max(vw / W, vh / H), vw / 1600, vh / 880);
          ox = (vw - W * echelle) / 2;
          oy = (vh - H * echelle) / 2;
          if (ox < 0) ox = Math.max(ox, vw - W * echelle);
          poser(logo, 45, 60, 540);
          poser(menu, 55, 300, 430);
          menu.style.fontSize = 40 * echelle + 'px';
        } else {
          // portrait : logo en haut, plateau et cartes au milieu, boutons dessous
          echelle = vw / 1040;
          ox = -470 * echelle;
          const mw = Math.min(vw - 70, 300);
          Object.assign(menu.style, {
            left: (vw - mw) / 2 + 'px',
            width: mw + 'px',
            fontSize: Math.min(26, mw / 12) + 'px',
          });
          // le menu se place juste au-dessus de la barre du bas, la scène juste au-dessus du menu
          const hautBarre = $('#barre').offsetHeight + 24;
          const topMenu = vh - hautBarre - menu.offsetHeight - 6;
          menu.style.top = topMenu + 'px';
          oy = topMenu - 925 * echelle;
          const lw = Math.min(vw - 80, 380);
          Object.assign(logo.style, {
            left: (vw - lw) / 2 + 'px',
            top: Math.max(56, oy + 90 * echelle - lw * 0.36) + 'px',
            width: lw + 'px',
          });
        }
        scene.style.transform = `translate(${ox}px,${oy}px) scale(${echelle})`;
      }
      function poser(el, x, y, w) {
        el.style.left = ox + x * echelle + 'px';
        el.style.top = oy + y * echelle + 'px';
        el.style.width = w * echelle + 'px';
      }
      addEventListener('resize', placer);
      placer();

      // --- Entrée : logo, menu, barre, puis distribution des cartes ---
      setTimeout(() => logo.classList.add('go'), 700);
      setTimeout(() => {
        logo.classList.remove('go');
        logo.style.opacity = 1;
        logo.classList.add('vit');
      }, 1850);
      document.querySelectorAll('.apparait').forEach((b, i) => setTimeout(() => b.classList.add('go'), 1250 + i * 110));
      setTimeout(() => $('#barre').classList.add('go'), 1700);

      // --- Boutons : simple message (maquette) ---
      const toast = $('#toast');
      let tt;
      document.querySelectorAll('[data-msg]').forEach(b =>
        b.addEventListener('click', e => {
          e.stopPropagation();
          toast.textContent = b.dataset.msg + ' (maquette)';
          toast.classList.add('on');
          clearTimeout(tt);
          tt = setTimeout(() => toast.classList.remove('on'), 1600);
        }),
      );
    </script>
  </body>
</html>
